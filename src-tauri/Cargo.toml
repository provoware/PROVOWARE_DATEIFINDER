[package]
name = "provoware-dateifinder"
version = "0.1.1"
description = "PROVOWARE DateiFinder"
authors = ["PROVOWARE"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "provoware_dateifinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-store = "=2.4.5"
