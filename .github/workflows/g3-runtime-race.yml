name: g3-runtime-race

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-runtime-race-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  g3-runtime-race:
    name: G3 runtime - Start Cancel Restart stale events
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: G3 - execute real frontend race with deterministic Tauri boundary
        run: npx playwright test --config=playwright.g3.config.ts
