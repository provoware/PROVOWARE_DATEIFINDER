name: visual-bootstrap

on:
  push:
    branches:
      - feat/tauri2-foundation

permissions:
  contents: write

concurrency:
  group: visual-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Generate golden reference once
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Add exact Playwright dependency and scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts['test:visual'] = 'playwright test --project=chromium';
          pkg.scripts['test:visual:update'] = 'playwright test --project=chromium --update-snapshots';
          pkg.devDependencies['@playwright/test'] = '1.63.0';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Refresh deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install exact Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Generate 768x512 golden reference
        run: npm run test:visual:update

      - name: Commit package lock and baseline
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json tests/visual
          if git diff --cached --quiet; then
            echo "Golden reference is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): establish 768x512 golden reference"
          git push origin "HEAD:${GITHUB_REF_NAME}"
