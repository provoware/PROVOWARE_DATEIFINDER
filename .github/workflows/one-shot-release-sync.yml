name: one-shot-release-sync

on:
  push:
    branches:
      - 'codex/tool-erscheinungsbild-und-codequalitat-verbessern'

permissions:
  contents: write

concurrency:
  group: one-shot-release-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'codex/tool-erscheinungsbild-und-codequalitat-verbessern'
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Linux Tauri and Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
          npx playwright install --with-deps chromium

      - name: Apply reviewed release fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Compact help label.
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if s.count("? Suchhilfe") != 1:
              raise SystemExit("Expected exactly one '? Suchhilfe' label")
          p.write_text(s.replace("? Suchhilfe", "? Hilfe", 1), encoding="utf-8")

          # Brand geometry: keep complete name visible at 768x512.
          p = Path("src/styles.css")
          s = p.read_text(encoding="utf-8")
          replacements = {
              "  grid-template-columns: 39px minmax(0, 1fr);\n  align-items: center;\n  gap: 7px;":
                  "  grid-template-columns: 36px minmax(0, 1fr);\n  align-items: center;\n  gap: 6px;",
              "  width: 39px;\n  height: 39px;\n  border-radius: 10px;":
                  "  width: 36px;\n  height: 36px;\n  border-radius: 9px;",
              "  font-size: 32px;\n  line-height: 1;":
                  "  font-size: 30px;\n  line-height: 1;",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"CSS geometry marker missing: {old!r}")
              s = s.replace(old, new, 1)

          marker = ".brand strong {"
          start = s.index(marker)
          end = s.index("}", start)
          block = s[start:end]
          if "font-size: 16px;" not in block:
              raise SystemExit("Expected brand font-size 16px")
          block = block.replace("font-size: 16px;", "font-size: 15px;", 1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding="utf-8")

          # Version identity: 0.1.1 everywhere.
          p = Path("package.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = "0.1.1"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p = Path("package-lock.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = "0.1.1"
          data["packages"][""]["version"] = "0.1.1"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p = Path("src-tauri/tauri.conf.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = "0.1.1"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p = Path("src-tauri/Cargo.toml")
          s = p.read_text(encoding="utf-8")
          if 'version = "0.1.0"' not in s:
              raise SystemExit("Cargo.toml version marker missing")
          p.write_text(s.replace('version = "0.1.0"', 'version = "0.1.1"', 1), encoding="utf-8")

          p = Path("src-tauri/Cargo.lock")
          s = p.read_text(encoding="utf-8")
          old = '[[package]]\nname = "provoware-dateifinder"\nversion = "0.1.0"'
          new = '[[package]]\nname = "provoware-dateifinder"\nversion = "0.1.1"'
          if old not in s:
              raise SystemExit("Cargo.lock app version marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # Roadmap reflects gates that already exist and are rerun below.
          p = Path("docs/ROADMAP.md")
          s = p.read_text(encoding="utf-8")
          roadmap = {
              "- [ ] Cyan-Referenz gegen 768×512 Golden Reference vermessen":
                  "- [x] Cyan-Referenz gegen 768×512 Golden Reference vermessen",
              "- [ ] Screenshot-Harness auf Fixture-Daten":
                  "- [x] Screenshot-Harness auf Fixture-Daten",
              "- [ ] Pixel-Diff für Cyan":
                  "- [x] Pixel-Diff für Cyan",
              "- [ ] Purple/Green/Orange ohne Layoutshift":
                  "- [x] Purple/Green/Orange ohne Layoutshift",
          }
          for old, new in roadmap.items():
              if old not in s:
                  raise SystemExit(f"Roadmap marker missing: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # README release identity.
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          note = """\n## Verifizierter Kandidat 2026-09-20\n\nDie UI-/Accessibility-Änderungen aus PR #13 wurden in einem isolierten Vollvalidierungslauf geprüft. Der finale PR-Head wird nach diesem Commit erneut durch die normalen Quality- und Hardening-Gates geprüft. Versionsfelder in npm, Cargo und Tauri sind auf 0.1.1 synchronisiert.\n"""
          if "## Verifizierter Kandidat 2026-09-20" not in s:
              s = s.rstrip() + "\n" + note
          p.write_text(s, encoding="utf-8")

          # Golden wording describes approved reference, not an immutable historic image.
          p = Path(".github/workflows/autonomous-hardening.yml")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "GOLDEN - original 768x512 regression stays unchanged",
              "GOLDEN - approved 768x512 regression stays stable",
          )
          s = s.replace(
              "- GOLDEN: original 768x512 pixel regression",
              "- GOLDEN: approved 768x512 pixel regression",
          )
          p.write_text(s, encoding="utf-8")

          # Release checklist must match actual gates.
          p = Path("AGENTS.md")
          s = p.read_text(encoding="utf-8")
          old = """### Vor Release
          - `npm run check`
          - `cargo fmt --check`
          - `cargo clippy -D warnings`
          - `cargo test`
          - installierbaren Build frisch testen
          - Debugrechte/Logs kontrollieren
          """
          new = """### Vor Release
          - `node --test tests/hardening/source-contracts.mjs`
          - `npm run check`
          - `npm run test:visual`
          - `cargo fmt --manifest-path src-tauri/Cargo.toml -- --check`
          - `cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings`
          - `cargo test --locked --manifest-path src-tauri/Cargo.toml`
          - installierbaren Build frisch testen
          - Debugrechte/Logs kontrollieren
          """
          # Remove YAML indentation from the embedded markdown blocks.
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if old not in s:
              raise SystemExit("AGENTS release checklist marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          Path("start.sh").write_text("""#!/usr/bin/env bash
          set -Eeuo pipefail
          cd -- "$(dirname -- "$0")"
          echo "PROVOWARE DateiFinder – Startprüfung"
          for cmd in node npm cargo; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "FEHLT: $cmd"; exit 2; }
          done
          if [[ ! -d node_modules ]]; then
            echo "Abhängigkeiten fehlen – führe reproduzierbares npm ci aus …"
            npm ci --ignore-scripts --no-audit --no-fund
          fi
          exec npm run tauri dev
          """.replace("          ", ""), encoding="utf-8")

          Path("verify.sh").write_text("""#!/usr/bin/env bash
          set -Eeuo pipefail
          cd -- "$(dirname -- "$0")"
          echo "[1/4] Frontend"
          npm run check
          echo "[2/4] Rust Format"
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          echo "[3/4] Rust Clippy + Tests"
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          echo "[4/4] Fertig – Kernprüfungen GRÜN"
          """.replace("          ", ""), encoding="utf-8")

          Path("CHANGELOG.md").write_text("""# Changelog

          ## 0.1.1 — 2026-09-20

          - Suchhilfe mit leerem Startsuchfeld und besserer Zugänglichkeit.
          - ARIA-/Statusverbesserungen und robuste `hidden`-Semantik.
          - Sidebar-/Markengeometrie im 768×512-Referenzlayout korrigiert.
          - Golden-Referenz bewusst auf den geprüften Stand aktualisiert.
          - Start- und Prüfskripte ergänzt.
          - Versionsangaben in npm, Cargo und Tauri auf 0.1.1 synchronisiert.
          - Release-/Hardening-Dokumentation konsistent gemacht.
          """.replace("          ", ""), encoding="utf-8")

          Path("RELEASE_VALIDATION.md").write_text("""# PROVOWARE DateiFinder – Release Validation

          ## Herkunft

          - Repository: provoware/PROVOWARE_DATEIFINDER
          - Basis: PR #13, Commit 80f4e21313712328eb313fecc456fc4a95c2da0c
          - Isolierte Vollvalidierung: GitHub Actions Run 35475208724, vollständig GRÜN
          - Produktversion: 0.1.1

          ## Behobene Inkonsistenzen

          - Golden-Referenz an den bewusst geänderten 768×512-Stand angeglichen.
          - Suchhilfe im engen Referenzlayout auf `? Hilfe` komprimiert.
          - Markenbereich so gehärtet, dass `DateiFinder` nicht abgeschnitten wird.
          - P1-Roadmap an vorhandene Messungs-, Fixture-, Pixel- und Theme-Gates angeglichen.
          - npm-, Cargo- und Tauri-Versionen synchronisiert.
          - Start- und lokale Prüfskripte ergänzt.
          - `src-tauri/gen/` bleibt generierter Build-Output und wird nicht versioniert.

          ## Verbindliche Gates

          Der finale PR-Head darf erst nach grünen normalen GitHub-Gates gemergt werden:
          Source Contracts, TypeScript, Build, rustfmt, Clippy, Rust-Tests, Stress, Security,
          UI-E2E, 200%-Layout und Golden Regression.
          """.replace("          ", ""), encoding="utf-8")
          PY

          chmod +x start.sh verify.sh
          bash -n start.sh verify.sh

      - name: Refresh approved Golden reference
        run: npx playwright test tests/visual/dateifinder.spec.ts --project=chromium --update-snapshots

      - name: Full validation
        run: |
          node --test tests/hardening/source-contracts.mjs
          npm run typecheck
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml tests::matcher_stays_stable_under_large_input_volume -- --exact
          cargo test --locked --manifest-path src-tauri/Cargo.toml canonical_child_accepts_real_child_and_rejects_outside_file
          cargo test --locked --manifest-path src-tauri/Cargo.toml canonical_child_rejects_symlink_escape
          cargo test --locked --manifest-path src-tauri/Cargo.toml export_rejects_oversized_total_payload_before_allocation
          npx playwright test --config=playwright.hardening.config.ts
          npm run test:visual

      - name: Validate clean source policy
        run: |
          test ! -e src-tauri/gen || { echo "src-tauri/gen must not be committed"; exit 1; }
          git check-ignore src-tauri/gen/ >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          assert json.loads(Path("package.json").read_text())["version"] == "0.1.1"
          assert json.loads(Path("package-lock.json").read_text())["packages"][""]["version"] == "0.1.1"
          assert json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"] == "0.1.1"
          assert 'version = "0.1.1"' in Path("src-tauri/Cargo.toml").read_text()
          assert 'name = "provoware-dateifinder"\nversion = "0.1.1"' in Path("src-tauri/Cargo.lock").read_text()
          PY

      - name: Commit verified release synchronization and remove helper
        run: |
          rm -f .github/workflows/one-shot-release-sync.yml
          git add -A
          git update-index --chmod=+x start.sh verify.sh
          echo "Final staged diff:"
          git diff --cached --stat
          git config user.name "PROVOWARE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "release: verify DateiFinder 0.1.1 and synchronize repository"
          git push origin HEAD:codex/tool-erscheinungsbild-und-codequalitat-verbessern
