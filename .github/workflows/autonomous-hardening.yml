name: autonomous-hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hardening:
    name: SCHNELL -> TIEF -> STRESS -> SECURITY -> UI-E2E -> 200%-LAYOUT -> EVIDENCE
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Set up exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: SCHNELL - source contracts and TypeScript
        run: |
          node --test tests/hardening/source-contracts.mjs
          npm run typecheck

      - name: TIEF - build fmt clippy and complete Rust suite
        run: |
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: STRESS - 100000 matcher cases
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml tests::matcher_stays_stable_under_large_input_volume -- --exact

      - name: SECURITY - path escape symlink and export bounds
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml canonical_child_accepts_real_child_and_rejects_outside_file
          cargo test --locked --manifest-path src-tauri/Cargo.toml canonical_child_rejects_symlink_escape
          cargo test --locked --manifest-path src-tauri/Cargo.toml export_rejects_oversized_total_payload_before_allocation

      - name: Install exact Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: UI-E2E - static application acceptance matrix
        run: npx playwright test --config=playwright.hardening.config.ts --grep "reference shell|theme|keyboard"

      - name: 200%-LAYOUT - critical controls remain reachable
        run: npx playwright test --config=playwright.hardening.config.ts --grep "200-percent"

      - name: GOLDEN - approved 768x512 regression stays stable
        run: npm run test:visual

      - name: Post-Merge-Evidence candidate report
        if: always()
        run: |
          {
            echo "# AUTONOMOUS HARDENING 0.1"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Branch/Ref: $GITHUB_REF"
            echo
            echo "Automated gates executed:"
            echo "- SCHNELL: source contracts + TypeScript"
            echo "- TIEF: production build + rustfmt + clippy + Rust suite"
            echo "- STRESS: 100000 matcher cases"
            echo "- SECURITY: root escape + symlink escape + export bounds"
            echo "- UI-E2E: static application acceptance matrix"
            echo "- 200%-LAYOUT: critical-control reachability"
            echo "- GOLDEN: approved 768x512 pixel regression"
          } | tee hardening-evidence.md
          cat hardening-evidence.md >> "$GITHUB_STEP_SUMMARY"
