name: g5-security-fail-first

on:
  push:
    branches:
      - hardening/g5-security-fail-first-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-security-fail-first-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  g5-security-fail-first:
    name: G5 security - parent traversal unicode unapproved root
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: G5 - parent traversal escape
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml tests::canonical_child_rejects_parent_traversal_escape -- --exact

      - name: G5 - unicode path inside root
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml tests::canonical_child_accepts_unicode_path_inside_root -- --exact

      - name: G5 - reject unapproved root
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml tests::validated_allowed_file_rejects_unapproved_root -- --exact
