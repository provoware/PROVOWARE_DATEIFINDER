name: g5-state-tests-once

on:
  push:
    branches:
      - ops/g5-state-tests-runner

permissions:
  contents: write

jobs:
  g5-state-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout G5 test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/g5-security-fail-first-1
          fetch-depth: 0

      - name: Insert exactly three G5 state tests
        shell: bash
        env:
          G5_TESTS_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text()
          anchor = "    #[cfg(unix)]\n    #[test]\n    fn canonical_child_rejects_symlink_escape() {"
          if text.count(anchor) != 1:
              raise SystemExit(f"expected exactly one insertion anchor, found {text.count(anchor)}")
          tests = base64.b64decode(os.environ["G5_TESTS_B64"]).decode("utf-8")
          path.write_text(text.replace(anchor, tests + anchor, 1))
          PY

          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src-tauri/src/lib.rs"
          git diff -- src-tauri/src/lib.rs

      - name: Commit test-only patch
        shell: bash
        run: |
          git config user.name "provoware"
          git config user.email "provoware.one@gmail.com"
          git add src-tauri/src/lib.rs
          git commit -m "test: cover removed and moved G5 paths"
          git push origin HEAD:hardening/g5-security-fail-first-1

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: G5 - removed approved root
        shell: bash
        run: timeout 180s cargo test --locked --manifest-path src-tauri/Cargo.toml tests::validated_allowed_file_rejects_root_removed_after_approval -- --exact

      - name: G5 - deleted approved file
        shell: bash
        run: timeout 180s cargo test --locked --manifest-path src-tauri/Cargo.toml tests::validated_allowed_file_rejects_file_deleted_after_approval -- --exact

      - name: G5 - moved file outside approved root
        shell: bash
        run: timeout 180s cargo test --locked --manifest-path src-tauri/Cargo.toml tests::validated_allowed_file_rejects_file_moved_outside_approved_root -- --exact
