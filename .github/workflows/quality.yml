name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start assistant safety and abort contracts
        run: node --test tests/start-contracts.mjs

      - name: Finding statistics aggregation contracts
        run: node --experimental-strip-types --test tests/date-format.test.mjs tests/export-lines.test.mjs tests/findings-insights.test.mjs tests/preferences.test.mjs

      - name: TypeScript gate
        run: npm run typecheck

      - name: Production build gate
        run: npm run build

  visual:
    name: Golden Reference 768x512
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install exact Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Compare 768x512 Golden Reference
        run: npm run test:visual

      - name: Retain visual failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-failure-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust format gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Bei einem Formatfehler entsteht ein reproduzierbarer Vorschlag für den Review.
      # Der fehlgeschlagene Gate wird dadurch ausdrücklich NICHT grün.
      - name: Prepare Rust formatting diagnostic
        if: failure()
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Attach formatted Rust diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfmt-diagnostic
          path: src-tauri/src/
          retention-days: 2

      - name: Rust Clippy gate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test gate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
